[package]
name = "rs-plugin-tmdb"
version = "0.15.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
extism-pdk = "1.4.1"
rs-plugin-common-interfaces = { git = "https://github.com/neckaros/rs-plugin-common-interfaces", rev = "67fb91223860a7e2086d9d2e309584a0e168eaa8", version = "0.40.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
extism = "1"

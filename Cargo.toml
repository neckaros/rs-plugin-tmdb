[package]
name = "rs-plugin-tmdb"
version = "0.14.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
extism-pdk = "1.4.1"
rs-plugin-common-interfaces = { git = "https://github.com/neckaros/rs-plugin-common-interfaces", rev = "d48d51027777d7c2679ff2d26491bffe330e4b14", version = "0.39.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
extism = "1"
